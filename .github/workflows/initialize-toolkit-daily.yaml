---
name: Check BMT initialization daily

on:
  pull_request:
  schedule:
    - cron: '0 5 * * *'  # once per day at midnight ET
  workflow_dispatch:
  # Allows you to run this workflow manually from the Actions tab
    types: trigger-run-check-toolkit-initialization

permissions:
  contents: read

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [ "3.10", "3.11", "3.12", "3.13" ]

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: setup python environment
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          make install

      - name: Run bmt tests
        run: |
          make test

      - name: Clone KGX and install dev branch of bmt
        run: |
          cd ../
          pwd
          git clone https://github.com/biolink/kgx.git
          cd kgx
          uv venv  # create virtual environment
          uv pip install -e .  # install kgx with its dependencies
          ls -al ../
          uv pip install /home/runner/work/biolink-model-toolkit/biolink-model-toolkit  # override with local bmt

      - name: Setup Neo4j Docker
        run: |
          cd ../
          pwd
          cd kgx
          docker run --detach --name kgx-neo4j-unit-test -p 8484:7474 -p 8888:7687 --env NEO4J_AUTH=neo4j/test neo4j:4.3.0
          docker run --detach --name kgx-neo4j-integration-test -p 7474:7474 -p 7687:7687 --env NEO4J_AUTH=neo4j/test neo4j:4.3.0
          docker ps -a

      # Was jakejarvis/wait-action@master -- a mutable branch ref on a personal
      # repo, unmaintained since 2021, for something the shell does natively.
      - name: Wait
        run: sleep 45

      - name: Run kgx tests
        run: |  
          cd ../
          pwd
          cd kgx
          uv run pytest tests/unit/test_source/*.py
          uv run pytest tests/unit/test_sink/*.py
          uv run pytest tests/unit/*.py
          uv run pytest tests/integration/*.py